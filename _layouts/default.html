<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} | {% endif %}SEITO</title>
<meta name="description" content="{% if page.dek %}{{ page.dek | escape }}{% else %}{{ site.description | strip }}{% endif %}">
<meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}SEITO{% endif %}">
<meta property="og:site_name" content="SEITO">
{% if page.cover %}<meta property="og:image" content="{{ page.cover | absolute_url }}">{% endif %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body class="{{ page.body_class }}">
{% include header.html %}
<main id="main">
{{ content }}
</main>
{% include footer.html %}
<div class="lightbox" id="lightbox" hidden>
  <button type="button" class="lightbox-close" aria-label="關閉">&times;</button>
  <button type="button" class="lightbox-prev" aria-label="上一張">&larr;</button>
  <img alt="">
  <button type="button" class="lightbox-next" aria-label="下一張">&rarr;</button>
  <p class="lightbox-count"></p>
</div>
<script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
