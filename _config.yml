title: SEITO
tagline: for the People, the Community and the Culture
description: >-
  SEITO 是臺語「梳妝打扮」的諧音，2021 年創立於臺灣的獨立時尚媒體，
  呈現時尚、創意與社群。For the People, the Community and the Culture.
og_image: /assets/img/og-default.jpg
url: "https://seito-official.com"
baseurl: ""
lang: zh-Hant
timezone: Asia/Taipei
instagram: https://www.instagram.com/seito__official/

plugins:
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

permalink: /stories/:title/

# Stories 底下的小分類
sections:
  - { key: interview, label: 專訪, en: Interviews, path: /stories/interviews/ }
  - { key: profile, label: 人物誌, en: Profiles, path: /stories/profiles/ }
  - { key: article, label: 文章, en: Articles, path: /stories/articles/ }

collections:
  events:
    output: true
    permalink: /events/:name/
  merch:
    output: true
    permalink: /archive/:name/
  projects:
    output: true
    permalink: /creative/:name/

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: events }
    values: { layout: event }
  - scope: { path: "", type: merch }
    values: { layout: merch }
  - scope: { path: "", type: projects }
    values: { layout: project }

exclude:
  - README.md
  - seito-apps-script.txt
  - .pages.yml
